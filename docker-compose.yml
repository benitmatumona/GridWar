services:
  postgres:
    image: postgres:17-alpine
    container_name: gridwar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridwar
      POSTGRES_USER: gridwar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridwar_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - gridwar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gridwar-postgres-data:
